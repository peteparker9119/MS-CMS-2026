<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Activity — CMS</title>
<link rel="stylesheet" href="_layout.css">
<style>
/* Two-column layout */
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start }

/* Cards */
.panel {
  background:#fff; border:1px solid var(--line);
  border-radius:12px; overflow:hidden; margin-bottom:16px;
}
.panel-head {
  padding:16px 18px; border-bottom:1px solid var(--line);
  font-weight:600; font-size:15px; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.panel-body { padding:20px 22px }

/* Form elements */
.fg { margin-bottom:14px }
.fg label { display:block; font-size:11px; font-weight:600; color:var(--ink3); margin-bottom:5px }
.fg input,
.fg select,
.fg textarea {
  width:100%; border:1px solid var(--line); border-radius:8px;
  padding:7px 10px; font-size:13px; outline:none;
  font-family:inherit; color:var(--ink);
  background:#fff; resize:vertical;
}
.fg input:focus,
.fg select:focus,
.fg textarea:focus { border-color:var(--accent) }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px }

/* Criteria builder */
.crit-row { display:flex; gap:8px; margin-bottom:8px; align-items:center }
.crit-row input { border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:13px; outline:none }
.crit-row input:focus { border-color:var(--accent) }
.crit-lbl { flex:1 }
.crit-max { width:70px }
.crit-rem { background:none; border:none; cursor:pointer; color:var(--bad); font-size:20px; line-height:1; padding:0 4px; flex-shrink:0 }
.add-crit-btn {
  width:100%; border:1px dashed var(--line); border-radius:6px;
  padding:6px 14px; background:none; cursor:pointer;
  font-size:12px; color:var(--ink3);
  transition:background .13s;
}
.add-crit-btn:hover { background:rgba(0,0,0,.03) }

/* Buttons */
.btn-dark {
  padding:8px 18px; background:var(--ink); color:#fff;
  border:none; border-radius:8px; cursor:pointer;
  font-size:13px; font-weight:600; transition:opacity .13s;
}
.btn-dark:hover { opacity:.84 }

/* Frequency badge */
.freq-badge {
  display:inline-block; padding:2px 8px; border-radius:12px;
  font-size:10px; font-weight:700; text-transform:capitalize;
}
.freq-badge.weekly    { background:#dbeafe; color:#1e40af }
.freq-badge.monthly   { background:#dcfce7; color:#166534 }
.freq-badge.quarterly { background:#fef3c7; color:#92400e }

/* Template list rows */
.tmpl-row {
  padding:10px 14px; border-bottom:1px solid var(--line);
  font-size:13px; cursor:pointer; transition:background .12s;
}
.tmpl-row:last-child { border-bottom:none }
.tmpl-row:hover { background:var(--paper) }
.tmpl-row.selected { background:var(--accent-light) }
.tmpl-row-top { display:flex; align-items:center; gap:8px; margin-bottom:3px }
.tmpl-row-meta { font-size:11px; color:var(--ink3); display:flex; gap:12px; flex-wrap:wrap }

/* Score input row */
.score-row { display:flex; align-items:center; gap:10px; margin-bottom:8px }
.score-lbl { flex:1; font-size:13px; color:var(--ink) }
.score-lbl .max { color:var(--ink3); font-size:11px }
.score-inp {
  width:80px; border:1px solid var(--line); border-radius:6px;
  padding:6px 9px; font-size:13px; text-align:center; outline:none;
}
.score-inp:focus { border-color:var(--accent) }

/* Recent entry rows */
.entry-row {
  padding:10px 14px; border-bottom:1px solid var(--line);
  font-size:13px;
}
.entry-row:last-child { border-bottom:none }
.entry-row-top { font-weight:600; margin-bottom:2px }
.entry-row-meta { font-size:11px; color:var(--ink3); display:flex; gap:12px; flex-wrap:wrap }
.entry-notes { font-size:12px; color:var(--ink2); margin-top:4px; font-style:italic }

/* Freq filter seg */
.seg button {
  padding:5px 13px; background:none; border:none; cursor:pointer;
  font-size:12.5px; font-weight:500; color:var(--ink3);
  border-radius:6px; transition:background .13s;
}
.seg button.on { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.1) }

/* Empty state */
.empty { padding:24px; color:var(--ink3); font-size:13px; text-align:center }

/* Score bar (for recent entry detail) */
.score-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:5px }
.score-bar-row .sb-lbl { width:130px; font-size:11px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.score-bar-row .sb-bar { flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden }
.score-bar-row .sb-fill { height:100%; border-radius:3px; background:var(--accent) }
.score-bar-row .sb-val { width:36px; font-size:11px; font-weight:600; color:var(--ink); text-align:right }
</style>
</head>

</div>

<!-- Header -->
<div class="header">
  <div class="page-title">
    <div class="name">Team Activity</div>
    <div class="sub">Review templates &amp; entries</div>
  </div>
  <div class="header-actions">
    <button class="hbtn" style="position:relative">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1a5 5 0 0 1 5 5c0 3 1.5 4 1.5 4h-13S3 9 3 6a5 5 0 0 1 5-5zM6 13a2 2 0 0 0 4 0"/></svg>
      <span style="position:absolute;top:4px;right:4px;background:var(--bad);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">2</span>
    </button>
    <button class="user-btn">
      <span class="u-avatar" style="background:#1e2333">AD</span>
      <span class="name">Admin</span>
      <span class="caret">▾</span>
    </button>
  </div>
</div>

<!-- Main -->
<div class="app">
  <div class="wrap">

    <!-- Filter bar -->
    <div class="filterbar">
      <div class="period">
        <div class="l">Review Formats</div>
        <div class="v">Templates &amp; review entries</div>
      </div>
      <div class="seg" id="freq-seg">
        <button class="on" onclick="setFreq('All')">All</button>
        <button onclick="setFreq('Weekly')">Weekly</button>
        <button onclick="setFreq('Monthly')">Monthly</button>
        <button onclick="setFreq('Quarterly')">Quarterly</button>
      </div>
    </div>

    <!-- Two-column layout -->
    <div class="two-col">

      <!-- LEFT: Template builder + list -->
      <div>
        <!-- Create Template (admin only) -->
        <div class="panel">
          <div class="panel-head">Create Template</div>
          <div class="panel-body">
            <div class="fg">
              <label>Title</label>
              <input type="text" id="t-title" placeholder="e.g. Monthly Field Review">
            </div>
            <div class="row2">
              <div class="fg">
                <label>Unit</label>
                <select id="t-unit">
                  <option value="">— All units —</option>
                  <option value="vp">VETRI Palligal (VP)</option>
                  <option value="smc">SMC</option>
                  <option value="cg">Career Guidance</option>
                  <option value="acis">ACIS</option>
                  <option value="nsnop">NSNOP</option>
                  <option value="alumni">Alumni</option>
                  <option value="manarkeni">Manarkeni</option>
                </select>
              </div>
              <div class="fg">
                <label>Frequency</label>
                <select id="t-freq">
                  <option value="weekly">Weekly</option>
                  <option value="monthly" selected>Monthly</option>
                  <option value="quarterly">Quarterly</option>
                </select>
              </div>
            </div>
            <div class="fg">
              <label>Description</label>
              <textarea id="t-desc" rows="2" placeholder="Optional description..."></textarea>
            </div>

            <!-- Criteria builder -->
            <div class="fg" style="margin-bottom:4px">
              <label>Criteria</label>
              <div id="criteria-list">
                <!-- rendered by JS -->
              </div>
              <button class="add-crit-btn" onclick="addCrit()">+ Add criterion</button>
            </div>

            <div style="margin-top:16px">
              <button class="btn-dark" onclick="createTemplate()">Create Template</button>
            </div>
          </div>
        </div>

        <!-- Templates list -->
        <div class="panel">
          <div class="panel-head">
            Templates
            <span id="tmpl-count" style="font-size:13px;font-weight:400;color:var(--ink3);margin-left:4px">(0)</span>
          </div>
          <div id="tmpl-list">
            <!-- rendered by JS -->
          </div>
        </div>
      </div>

      <!-- RIGHT: Fill review + recent entries -->
      <div>
        <!-- Fill Review -->
        <div class="panel">
          <div class="panel-head">Fill Review</div>
          <div class="panel-body">
            <div class="fg">
              <label>Template</label>
              <select id="r-tmpl" onchange="onTmplChange()">
                <option value="">— Select template —</option>
              </select>
            </div>
            <div class="row2">
              <div class="fg">
                <label>Date</label>
                <input type="date" id="r-date">
              </div>
              <div class="fg">
                <label>Unit</label>
                <select id="r-unit">
                  <option value="">— Select —</option>
                  <option value="vp">VETRI Palligal (VP)</option>
                  <option value="smc">SMC</option>
                  <option value="cg">Career Guidance</option>
                  <option value="acis">ACIS</option>
                  <option value="nsnop">NSNOP</option>
                  <option value="alumni">Alumni</option>
                  <option value="manarkeni">Manarkeni</option>
                </select>
              </div>
            </div>

            <!-- Dynamic score inputs -->
            <div id="score-section" style="display:none; margin-bottom:16px">
              <div style="font-size:11px;font-weight:600;color:var(--ink3);margin-bottom:8px">SCORES</div>
              <div id="score-inputs"></div>
            </div>

            <div class="fg">
              <label>Overall Notes</label>
              <textarea id="r-notes" rows="2" placeholder="Summary observations…"></textarea>
            </div>
            <button class="btn-dark" onclick="submitReview()">Submit Review</button>
          </div>
        </div>

        <!-- Recent Reviews -->
        <div class="panel">
          <div class="panel-head">Recent Reviews</div>
          <div id="entries-list">
            <!-- rendered by JS -->
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:opacity .25s;z-index:9999;pointer-events:none"></div>

<script>
const TODAY = new Date().toISOString().slice(0, 10);

/* ── Data ── */
const UNIT_NAMES = {
  vp: 'VETRI Palligal (VP)', smc: 'SMC', cg: 'Career Guidance',
  acis: 'ACIS', nsnop: 'NSNOP', alumni: 'Alumni', manarkeni: 'Manarkeni',
};

let TEMPLATES = [
  {
    id: 1, title: 'Monthly Field Review', unit: 'vp', unit_name: 'VETRI Palligal (VP)',
    frequency: 'monthly', description: 'Monthly convergence field visit review',
    active: true, entries_count: 3,
    criteria: [
      { label: 'School Infrastructure', max_score: 10 },
      { label: 'Student Attendance', max_score: 10 },
      { label: 'Teacher Availability', max_score: 10 },
      { label: 'Program Compliance', max_score: 10 },
    ]
  },
  {
    id: 2, title: 'Weekly Coordination Check', unit: '', unit_name: null,
    frequency: 'weekly', description: 'Weekly team coordination meeting review',
    active: true, entries_count: 8,
    criteria: [
      { label: 'Meeting Attendance', max_score: 5 },
      { label: 'Action Point Completion', max_score: 5 },
      { label: 'Communication', max_score: 5 },
    ]
  },
  {
    id: 3, title: 'Quarterly Performance Review', unit: 'smc', unit_name: 'SMC',
    frequency: 'quarterly', description: 'SMC quarterly performance assessment',
    active: true, entries_count: 2,
    criteria: [
      { label: 'Enrollment Targets', max_score: 20 },
      { label: 'Dropout Prevention', max_score: 20 },
      { label: 'MoM Compliance', max_score: 10 },
    ]
  },
  {
    id: 4, title: 'Monthly ACIS Assessment', unit: 'acis', unit_name: 'ACIS',
    frequency: 'monthly', description: 'ACIS unit monthly KPI review',
    active: true, entries_count: 4,
    criteria: [
      { label: 'Data Entry Accuracy', max_score: 10 },
      { label: 'System Uptime', max_score: 10 },
      { label: 'Report Timeliness', max_score: 10 },
    ]
  },
];

let ENTRIES = [
  {
    id: 1, template: 1, tmpl_title: 'Monthly Field Review',
    date: '2026-06-05', unit: 'vp', unit_name: 'VETRI Palligal (VP)',
    avg_score: '8.5', overall_notes: 'Infrastructure improvements noted. Attendance good.',
    scores: [
      { criterion: 'School Infrastructure', score: 9 },
      { criterion: 'Student Attendance', score: 8 },
      { criterion: 'Teacher Availability', score: 9 },
      { criterion: 'Program Compliance', score: 8 },
    ]
  },
  {
    id: 2, template: 2, tmpl_title: 'Weekly Coordination Check',
    date: '2026-06-16', unit: '', unit_name: null,
    avg_score: '4.3', overall_notes: 'Good coordination this week. Some action points pending.',
    scores: [
      { criterion: 'Meeting Attendance', score: 5 },
      { criterion: 'Action Point Completion', score: 4 },
      { criterion: 'Communication', score: 4 },
    ]
  },
  {
    id: 3, template: 3, tmpl_title: 'Quarterly Performance Review',
    date: '2026-04-01', unit: 'smc', unit_name: 'SMC',
    avg_score: '15.3', overall_notes: 'Q1 performance satisfactory. Dropout rate needs attention.',
    scores: [
      { criterion: 'Enrollment Targets', score: 17 },
      { criterion: 'Dropout Prevention', score: 14 },
      { criterion: 'MoM Compliance', score: 15 },
    ]
  },
  {
    id: 4, template: 1, tmpl_title: 'Monthly Field Review',
    date: '2026-05-08', unit: 'vp', unit_name: 'VETRI Palligal (VP)',
    avg_score: '7.8', overall_notes: 'May review completed. Minor gaps in teacher availability.',
    scores: [
      { criterion: 'School Infrastructure', score: 8 },
      { criterion: 'Student Attendance', score: 8 },
      { criterion: 'Teacher Availability', score: 7 },
      { criterion: 'Program Compliance', score: 8 },
    ]
  },
];

let nextTmplId = 10;
let nextEntryId = 10;
let criteria = [{ label: '', max_score: '' }];
let freqFilter = 'All';

// ── Toast ──
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2500);
}

// ── Frequency filter ──
function setFreq(f) {
  freqFilter = f;
  document.querySelectorAll('#freq-seg button').forEach(b => {
    b.classList.toggle('on', b.textContent === f);
  });
  renderTmplList();
}

function filteredTemplates() {
  const MAP = { 'All': '', 'Weekly': 'weekly', 'Monthly': 'monthly', 'Quarterly': 'quarterly' };
  const fv = MAP[freqFilter];
  return fv ? TEMPLATES.filter(t => t.frequency === fv) : TEMPLATES;
}

// ── Criteria builder ──
function renderCriteria() {
  document.getElementById('criteria-list').innerHTML = criteria.map((c, i) => `
    <div class="crit-row">
      <input class="crit-lbl" type="text" placeholder="Criterion label"
        value="${c.label}" oninput="criteria[${i}].label=this.value">
      <input class="crit-max" type="number" placeholder="Max"
        value="${c.max_score}" oninput="criteria[${i}].max_score=this.value">
      ${criteria.length > 1
        ? `<button class="crit-rem" onclick="remCrit(${i})" title="Remove">×</button>`
        : '<span style="width:28px"></span>'
      }
    </div>
  `).join('');
}

function addCrit() {
  criteria.push({ label: '', max_score: '' });
  renderCriteria();
}

function remCrit(i) {
  criteria = criteria.filter((_, idx) => idx !== i);
  renderCriteria();
}

// ── Templates ──
function renderTmplList() {
  const list = filteredTemplates();
  const el = document.getElementById('tmpl-list');
  document.getElementById('tmpl-count').textContent = `(${list.length})`;

  if (!list.length) {
    el.innerHTML = '<div class="empty">No templates found.</div>';
    return;
  }
  el.innerHTML = list.map(t => `
    <div class="tmpl-row" onclick="selectTemplate(${t.id})">
      <div class="tmpl-row-top">
        <span style="font-weight:600;flex:1">${t.title}</span>
        <span class="freq-badge ${t.frequency}">${t.frequency}</span>
        ${t.active !== false ? '<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700">Active</span>' : ''}
      </div>
      <div class="tmpl-row-meta">
        ${t.unit_name ? `<span>Unit: ${t.unit_name}</span>` : ''}
        <span>${t.criteria?.length ?? 0} criteria</span>
        <span>${t.entries_count ?? 0} entries</span>
      </div>
    </div>
  `).join('');

  // also update template dropdown in fill review
  renderTmplDropdown();
}

function renderTmplDropdown() {
  const sel = document.getElementById('r-tmpl');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— Select template —</option>' +
    TEMPLATES.map(t => `<option value="${t.id}">${t.title}</option>`).join('');
  sel.value = cur;
}

function selectTemplate(id) {
  document.getElementById('r-tmpl').value = id;
  onTmplChange();
  // scroll to fill review
  document.getElementById('r-tmpl').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function createTemplate() {
  const title = document.getElementById('t-title').value.trim();
  if (!title) { toast('Enter template title'); return; }
  const validCrit = criteria.filter(c => c.label.trim());
  const unit = document.getElementById('t-unit').value;
  const freq = document.getElementById('t-freq').value;
  const desc = document.getElementById('t-desc').value.trim();

  TEMPLATES.push({
    id: nextTmplId++,
    title,
    unit,
    unit_name: unit ? UNIT_NAMES[unit] : null,
    frequency: freq,
    description: desc,
    active: true,
    entries_count: 0,
    criteria: validCrit.map(c => ({ label: c.label, max_score: c.max_score ? +c.max_score : null })),
  });

  // reset form
  document.getElementById('t-title').value = '';
  document.getElementById('t-unit').value = '';
  document.getElementById('t-freq').value = 'monthly';
  document.getElementById('t-desc').value = '';
  criteria = [{ label: '', max_score: '' }];
  renderCriteria();
  renderTmplList();
  toast('Template created');
}

// ── Fill review ──
function onTmplChange() {
  const id = document.getElementById('r-tmpl').value;
  const tmpl = TEMPLATES.find(t => String(t.id) === id);
  const scoreSection = document.getElementById('score-section');
  const scoreInputs = document.getElementById('score-inputs');

  if (!tmpl || !tmpl.criteria?.length) {
    scoreSection.style.display = 'none';
    return;
  }

  scoreSection.style.display = 'block';
  scoreInputs.innerHTML = tmpl.criteria.map((c, i) => `
    <div class="score-row">
      <div class="score-lbl">
        ${c.label}
        ${c.max_score ? `<span class="max"> / ${c.max_score}</span>` : ''}
      </div>
      <input class="score-inp" type="number" min="0" max="${c.max_score || ''}"
        id="score-${i}" placeholder="0">
    </div>
  `).join('');
}

function submitReview() {
  const tmplId = document.getElementById('r-tmpl').value;
  if (!tmplId) { toast('Select a template'); return; }
  const tmpl = TEMPLATES.find(t => String(t.id) === tmplId);
  const date = document.getElementById('r-date').value || TODAY;
  const unit = document.getElementById('r-unit').value;
  const notes = document.getElementById('r-notes').value.trim();

  const scores = (tmpl?.criteria ?? []).map((c, i) => ({
    criterion: c.label,
    score: +(document.getElementById(`score-${i}`)?.value || 0),
  }));

  const avg = scores.length
    ? (scores.reduce((s, x) => s + x.score, 0) / scores.length).toFixed(1)
    : null;

  ENTRIES.unshift({
    id: nextEntryId++,
    template: +tmplId,
    tmpl_title: tmpl?.title ?? '—',
    date,
    unit,
    unit_name: unit ? UNIT_NAMES[unit] : null,
    avg_score: avg,
    overall_notes: notes,
    scores,
  });

  // Update entry count on template
  const tmplObj = TEMPLATES.find(t => String(t.id) === tmplId);
  if (tmplObj) tmplObj.entries_count = (tmplObj.entries_count || 0) + 1;

  // Reset form
  document.getElementById('r-tmpl').value = '';
  document.getElementById('r-date').value = '';
  document.getElementById('r-unit').value = '';
  document.getElementById('r-notes').value = '';
  document.getElementById('score-section').style.display = 'none';

  renderTmplList();
  renderEntries();
  toast('Review submitted');
}

// ── Recent entries ──
function renderEntries() {
  const sorted = [...ENTRIES].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 20);
  const el = document.getElementById('entries-list');

  if (!sorted.length) {
    el.innerHTML = '<div class="empty">No reviews yet.</div>';
    return;
  }

  el.innerHTML = sorted.map(e => {
    const scoresBars = e.scores?.length
      ? e.scores.map(s => {
          const tmpl = TEMPLATES.find(t => t.id === e.template);
          const crit = tmpl?.criteria?.find(c => c.label === s.criterion);
          const max = crit?.max_score || 10;
          const pct = Math.min(100, (s.score / max) * 100).toFixed(0);
          return `
            <div class="score-bar-row">
              <div class="sb-lbl">${s.criterion}</div>
              <div class="sb-bar"><div class="sb-fill" style="width:${pct}%"></div></div>
              <div class="sb-val">${s.score}</div>
            </div>`;
        }).join('')
      : '';

    return `
      <div class="entry-row">
        <div class="entry-row-top">${e.tmpl_title}</div>
        <div class="entry-row-meta">
          <span>${e.date}</span>
          ${e.unit_name ? `<span>Unit: ${e.unit_name}</span>` : ''}
          ${e.avg_score ? `<span style="color:var(--ok);font-weight:600">Avg: ${e.avg_score}</span>` : ''}
        </div>
        ${e.overall_notes ? `<div class="entry-notes">${e.overall_notes}</div>` : ''}
        ${scoresBars ? `<div style="margin-top:8px">${scoresBars}</div>` : ''}
      </div>
    `;
  }).join('');
}

// ── Init ──
document.getElementById('r-date').value = TODAY;
renderCriteria();
renderTmplList();
renderEntries();
</script>
</body>
</html>
